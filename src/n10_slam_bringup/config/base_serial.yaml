base_serial:
  ros__parameters:
    baud_rate: 115200
    wheel_diameter: 0.075
    # 轮心到车体中心的 X/Y 距离均为 80 mm，与 STM32 参数一致。
    # 250 x 230 mm 外形尺寸在 nav2_params.yaml 中单独配置。
    half_length: 0.080
    half_width: 0.080
    counts_per_revolution: 60000
    max_wheel_rpm: 200.0
    command_rate: 20.0
    cmd_vel_timeout: 0.30
    telemetry_timeout: 0.50
    use_imu_yaw_for_odom: true
    motor_signs: [1, 1, 1, 1]
    encoder_signs: [1, 1, 1, 1]
    odom_frame: odom
    base_frame: base_link
    imu_frame: base_link
